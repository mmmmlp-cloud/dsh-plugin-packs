<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Plugin Packs">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- two pack columns: left enabled, right disabled -->
    <rect x="7" y="12" width="21" height="40" rx="4" stroke="#4C9AFF" fill="#4C9AFF" fill-opacity="0.16"/>
    <rect x="36" y="12" width="21" height="40" rx="4" stroke="#8E8E93" fill="#8E8E93" fill-opacity="0.10" stroke-dasharray="4 4"/>
    <!-- enable arrow inside the left column -->
    <path d="M15 32h7M18 28l4 4-4 4" stroke="#4C9AFF"/>
    <!-- tag chips crossing both columns -->
    <rect x="12" y="44" width="11" height="5" rx="2.5" stroke="#7B68EE" fill="#7B68EE" fill-opacity="0.5" stroke-width="2"/>
    <rect x="41" y="44" width="11" height="5" rx="2.5" stroke="#8E8E93" fill="none" stroke-width="2"/>
    <path d="M30 24h4M30 32h4M30 40h4" stroke="#8E8E93" stroke-width="2" stroke-dasharray="2 3"/>
  </g>
</svg>
